<style>
/* Layout: one centered column in a boutique. A fitting-room panel (doll + her pieces) sits above a stitched white question card; every right answer unlocks a piece of the outfit. Single light look. */
:root{
  --bg:#FFE6EE; --plum:#3B1230; --plum-soft:#6B3A5E;
  --rose:#C72C74; --rose-deep:#8E1E52; --rose-light:#F7A8C8; --gold:#E9B44C;
  --paper:#FFFFFF; --line:rgba(59,18,48,.16);
  --st-mabni:#B59BF2; --st-raf:#6EC1F5; --st-nasb:#FFB36B;
  --good:#2FA66B; --good-bg:#E3F7EC; --bad:#E5484D; --bad-bg:#FDE9EA;
  --glass:rgba(255,255,255,.78);
  --f-display:'Aref Ruqaa','Cairo','Segoe UI',system-ui,sans-serif;
  --f-ui:'Cairo','Segoe UI','Geeza Pro',system-ui,sans-serif;
  --f-text:'Noto Naskh Arabic','Geeza Pro','Traditional Arabic',serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--plum);font:500 16px/1.6 var(--f-ui);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:3px solid var(--rose);outline-offset:3px}
.bgl{position:fixed;inset:0;z-index:0;opacity:0;transition:opacity 1.2s ease}
.bgl.on{opacity:1}
.bgl::before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.95) 1.6px,transparent 2.2px),radial-gradient(circle,rgba(199,44,116,.16) 1.4px,transparent 2px);background-size:48px 48px,48px 48px;background-position:0 0,24px 24px}
.b0{background:linear-gradient(180deg,#FFE9F0,#FBD0E0)}
.b1{background:linear-gradient(180deg,#FADDF0,#E7CBF3)}
.b2{background:linear-gradient(180deg,#F8D3E8,#D8BDF2)}
.wrap{position:relative;z-index:1;width:100%;max-width:620px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.st-mabni{--c:var(--st-mabni)} .st-raf{--c:var(--st-raf)} .st-nasb{--c:var(--st-nasb)}

/* HUD */
.hud{display:grid;gap:10px;padding:12px 14px;border-radius:20px;background:var(--glass);border:2px solid #fff;backdrop-filter:blur(6px)}
.hud-top,.hud-bot{display:flex;align-items:center;justify-content:space-between;gap:12px}
.lvl{display:grid;line-height:1.3}
.lvl b{font:700 24px/1.5 var(--f-display)}
.lvl span{font-size:13px;color:var(--plum-soft)}
.hud-r{display:flex;align-items:center;gap:10px}
.hearts{display:flex;gap:4px}
.heart{width:24px;height:24px}
.heart path{fill:#E83E8C;stroke:#E83E8C;stroke-width:1.5}
.heart.lost path{fill:none;stroke:#B58AA2;stroke-dasharray:3 2}
.mini{min-height:36px;padding:0 14px;border-radius:12px;border:2px solid var(--rose);background:#fff;color:var(--rose-deep);font-weight:900;font-size:14px}
.strand{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.bead{width:22px;height:22px;border-radius:50%;border:2px solid rgba(107,58,94,.45);background:#fff}
.bead.ok{background:var(--good);border-color:var(--good)}
.bead.no{background:var(--bad);border-color:var(--bad)}
.bead.now{border-color:var(--rose);box-shadow:0 0 0 4px rgba(199,44,116,.2)}
.score{display:flex;align-items:center;gap:6px;font-weight:900;font-size:18px;font-variant-numeric:tabular-nums}
.score svg{width:20px;height:20px}
.bump{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.25)}}

/* Fitting room */
.dressing{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:20px;background:var(--glass);border:2px solid #fff}
.avatar{flex:none;width:112px}
.doll{display:block;width:100%;height:auto;overflow:visible}
.item{opacity:0;transform:scale(.7);transform-box:fill-box;transform-origin:center;transition:opacity .35s,transform .5s cubic-bezier(.3,1.6,.5,1)}
.item.on{opacity:1;transform:none}
.dside{display:grid;gap:10px;min-width:0;flex:1}
.callout{margin:0;font:700 16px/1.5 var(--f-ui);color:var(--rose-deep)}
.shelf{display:flex;flex-wrap:wrap;gap:6px}
.piece{padding:1px 10px;border-radius:999px;font:700 13px/1.7 var(--f-ui);background:rgba(255,255,255,.7);color:var(--plum-soft);border:1.5px dashed rgba(107,58,94,.45)}
.piece.on{background:var(--rose);color:#fff;border:1.5px solid var(--rose)}

/* Panels, type, buttons */
.title{font:700 32px/1.5 var(--f-display);text-wrap:balance;margin:0}
.title.big{font-size:clamp(44px,13vw,64px);line-height:1.35;text-align:center}
.hero{display:grid;gap:12px;justify-items:center;text-align:center}
.hero .avatar{width:min(190px,52vw)}
.hero .lead{max-width:30em}
.hero .cta{width:100%;max-width:360px}
.panel{padding:22px 20px;border-radius:24px;background:var(--glass);border:2px solid #fff;backdrop-filter:blur(6px);display:grid;gap:12px}
.eyebrow{margin:0;font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--plum-soft)}
.lead{margin:0;font-size:18px;line-height:1.8}
.tip{margin:0;padding:12px 14px;border-radius:14px;background:rgba(199,44,116,.1);font-size:15px}
.meta,.best{margin:0;font-size:14px;color:var(--plum-soft)}
.best{font-weight:900;color:var(--rose-deep)}
.ribbon{margin:0;padding:8px 26px;border-radius:14px;background:#fff;border:2px dashed var(--rose);color:var(--plum);font-size:14px;line-height:1.5}
.ribbon b{display:block;font:700 24px/1.6 var(--f-display);color:var(--rose-deep)}
.credit{margin:4px 0 0;text-align:center;font:700 14px var(--f-ui);color:var(--plum-soft)}
.credit::before,.credit::after{content:"✦";color:var(--rose);margin-inline:8px}
.cta{min-height:56px;padding:0 24px;border:0;border-radius:18px;background:var(--rose);color:#fff;font:900 19px var(--f-ui);box-shadow:0 5px 0 var(--rose-deep),0 12px 22px rgba(199,44,116,.28);transition:transform .08s,box-shadow .08s}
.cta:active{transform:translateY(4px);box-shadow:0 1px 0 var(--rose-deep)}
.cta.ghost{background:#fff;color:var(--rose-deep);border:2px solid var(--rose);box-shadow:none}
.btnrow{display:grid;gap:10px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{padding:12px;border-radius:16px;background:#fff;display:grid}
.stat b{font:900 30px/1.15 var(--f-ui);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--plum-soft)}
.finalavatar{justify-self:center;width:min(200px,56vw)}

/* Question card (stitched) */
.card{position:relative;background:var(--paper);border:3px solid #fff;border-radius:24px;padding:22px 20px 20px;display:grid;gap:12px;box-shadow:0 14px 28px rgba(199,44,116,.18)}
.card::before{content:"";position:absolute;inset:7px;border:2px dashed rgba(199,44,116,.35);border-radius:18px;pointer-events:none}
.card>*{position:relative}
.card.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.q-instr{margin:0;font:700 15px var(--f-ui);color:var(--plum-soft)}
.sentence{margin:0;font:700 clamp(26px,7vw,34px)/1.9 var(--f-text);text-align:center;text-wrap:balance}
.verb{display:inline-block;padding:0 .4em;border-radius:12px;background:#FFF0F6;box-shadow:0 0 0 2px #E7A9C4,0 3px 0 rgba(59,18,48,.12)}
.verb.st-mabni,.verb.st-raf,.verb.st-nasb{box-shadow:0 0 0 3px var(--c),0 3px 0 rgba(59,18,48,.12)}
.vow{font-size:1.15em;color:var(--rose-deep)}
.vow.ph{display:inline-block;width:.42em;height:.42em;border:2px dashed var(--plum-soft);border-radius:50%;margin-inline-start:.08em}
.blank{display:inline-block;min-width:3.2em;border-bottom:3px dashed var(--plum-soft);color:var(--plum-soft);text-align:center}
.blank.filled{border-bottom:3px solid var(--good);color:var(--plum)}
.opts{display:grid;gap:10px}
.opts.row3{grid-template-columns:repeat(3,minmax(0,1fr))}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:10px 14px;border-radius:16px;border:2px solid var(--line);background:#fff;color:var(--plum);font:700 17px/1.4 var(--f-ui);text-align:start;transition:transform .08s}
.opt:active:not(:disabled){transform:scale(.98)}
.opt .dot{flex:none;width:16px;height:16px;border-radius:50%;background:var(--c)}
.opt .mark{margin-inline-start:auto;font-size:22px;line-height:1}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.right .mark::before{content:"✓";color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .mark::before{content:"✕";color:var(--bad)}
.opt.word{justify-content:center;font:700 26px/1.5 var(--f-text);min-height:64px;padding:6px 4px}
.opt.word .mark{display:none}
.words{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:6px 0}
.word{min-height:56px;padding:2px 18px;border-radius:16px;border:2px solid var(--line);background:#fff;color:var(--plum);font:700 28px/1.5 var(--f-text)}
.word.is-verb{border:2px dashed var(--rose);background:#FFF0F6}
.word.right{border:2px solid var(--good);background:var(--good-bg)}
.word.wrong{border:2px solid var(--bad);background:var(--bad-bg)}
.zones{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.zone{display:grid;justify-items:center;gap:2px;padding:12px 6px;border:3px solid transparent;border-radius:18px;background:var(--c);color:var(--plum);text-align:center}
.zone b{font:900 19px var(--f-ui)}
.zone small{font:700 12px/1.3 var(--f-ui)}
.zone.right{border-color:var(--good);box-shadow:0 0 0 3px #fff,0 0 0 6px var(--good)}
.zone.wrong{border-color:var(--bad);box-shadow:0 0 0 3px #fff,0 0 0 6px var(--bad)}
.zone:disabled:not(.right):not(.wrong){opacity:.5}
.timer{height:10px;border-radius:99px;background:rgba(59,18,48,.1);overflow:hidden}
.timer i{display:block;height:100%;transform-origin:right center;background:linear-gradient(90deg,var(--rose),var(--gold))}
.timer i.warn{background:linear-gradient(90deg,var(--bad),var(--gold))}
.timerlbl{margin:0;font:700 13px var(--f-ui);color:var(--plum-soft)}

/* Feedback */
.fb{padding:14px;border-radius:16px;border:2px solid var(--good);background:var(--good-bg);display:grid;gap:10px;animation:fbin .25s ease-out}
.fb.bad{border-color:var(--bad);background:var(--bad-bg)}
.fb.rare{border-color:var(--gold);background:linear-gradient(180deg,#FFF6D6,#E3F7EC)}
.fb h3{margin:0;font:900 19px var(--f-ui)}
.fb p{margin:0;font:500 18px/1.8 var(--f-ui)}
.nk{font:700 1.15em var(--f-text)}
@keyframes fbin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Guide and review */
.guide{display:grid;gap:10px}
.guide h2{font:700 30px/1.5 var(--f-display);margin:0}
.rule{display:grid;gap:6px;padding:14px;border-radius:16px;background:#fff;color:var(--plum)}
.rule h3{margin:0;font:900 18px var(--f-ui)}
.rule p{margin:0;font-size:16px;color:var(--plum-soft)}
.chip{justify-self:start;padding:2px 14px;border-radius:999px;background:var(--c);color:var(--plum);font:900 15px var(--f-ui)}
.ex{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-weight:700}
.exw{padding:0 12px;border-radius:10px;background:#FFF0F6;border:2px solid #F0C3D3;font:700 26px/1.6 var(--f-text)}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.tools span{padding:0 14px;border-radius:999px;background:#FFF0F6;border:2px solid #F0C3D3;font:700 22px/1.6 var(--f-text)}
.rev{border-radius:16px;background:rgba(255,255,255,.7);padding:4px 14px}
.rev summary{min-height:44px;display:flex;align-items:center;font-weight:900;cursor:pointer}
.rev .rule{margin-bottom:10px}
.rev .sentence{font-size:24px;text-align:start;line-height:1.7}
.mk{padding:0 .3em;border-radius:8px;background:#FFF0F6;box-shadow:0 0 0 2px var(--c,#E7A9C4)}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(59,18,48,.55);backdrop-filter:blur(4px);display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet-in{width:100%;max-width:620px;margin-block:16px;padding:16px;border-radius:24px;background:linear-gradient(180deg,#FFE9F0,#FBD0E0);display:grid;gap:12px}
@media (prefers-reduced-motion:reduce){
  .card.shake,.bump,.fb{animation:none}
  .item{transition:none}
}
</style>

 {t:'{v} الطالبة القصيدة',v:'تحفظ',vf:'تحفظُ',kind:'raf'},

 {t:'ننتظر حتى {v} العرض',v:'يبدأ',vf:'يبدأَ',kind:'nasb',p:'حتى'}
];
function endingQ(o){var vow=o.ans==='fatha'?FATHA:DAMMA;return Object.assign({type:'ending',kind:o.ans==='fatha'?'nasb':'raf',v:o.base,vf:o.base+vow},o);}
function buildLevel(n){
  var out=[],m,r,a,b,d;
  if(n===0){
    m=shuffle(L1.filter(function(x){return x.kind==='mabni';}));
    r=shuffle(L1.filter(function(x){return x.kind==='raf';}));
    var k=Math.random()<.5?3:2;
    return shuffle(m.slice(0,k).concat(r.slice(0,5-k))).map(function(x){return Object.assign({type:'state'},x);});
  }
  if(n===1){
    a=shuffle(L2A);b=shuffle(L2B);d=shuffle(L2D);
    var an=a.filter(function(x){return x.kind==='nasb';})[0],rf=a.filter(function(x){return x.kind==='raf';})[0];
    var bf=b.filter(function(x){return x.ans==='fatha';})[0],bd=b.filter(function(x){return x.ans==='damma';})[0];
    out=[Object.assign({type:'state'},an),Object.assign({type:'state'},rf),endingQ(bf),endingQ(bd),Object.assign({type:'tap',kind:'nasb'},d[0]),Object.assign({type:'tap',kind:'nasb'},d[1])];
    return shuffle(out);
  }
  ['mabni','raf','nasb'].forEach(function(k){
    shuffle(L3.filter(function(x){return x.kind===k;})).slice(0,2).forEach(function(x){out.push(Object.assign({type:'basket'},x));});
  });
  return shuffle(out);
}

function dressing(g,text){

function refreshDressing(announce){
  var g=stars(),doll=document.getElementById('doll');if(!doll)return;

  PIECES.forEach(function(p){
    var on=g>=p[2],el=doll.querySelector('.it-'+p[0]),chip=document.querySelector('.piece[data-id="'+p[0]+'"]');

/* ---------- Explanations ---------- */
function explain(q){
  var ve='<span class="nk">'+(q.vx||q.vf)+'</span>';
  if(q.kind==='mabni')return '«'+ve+'» فعل ماضٍ، والفعل الماضي مبني دائمًا. هنا هو مبني على الفتح.';
  if(q.kind==='raf')return '«'+ve+'» فعل مضارع ولم يسبقه ناصب، فهو مرفوع وعلامة رفعه الضمة.';
  return '«'+ve+'» فعل مضارع سبقته «'+q.p+'»، وهي من أدوات النصب، فهو منصوب وعلامة نصبه الفتحة.';
}
function fullSentence(q){
  var m='<span class="mk '+STATES[q.kind].cls+'">'+q.vf+'</span>';
  if(q.type==='tap')return q.w.map(function(x,i){return i===q.v?m:x;}).join(' ');
  if(q.type==='ending')return q.t.replace('{b}',m);
  return q.t.replace('{v}',m);
}
function mistakeItems(list){
  return list.map(function(q){return '<article class="rule"><p class="sentence">'+fullSentence(q)+'</p><p>'+explain(q)+'</p></article>';}).join('');
}

/* ---------- Timer ---------- */
function startTimer(){
  var bar=document.getElementById('tbar');if(!bar)return;
  bar.style.transition='none';bar.style.transform='scaleX(1)';void bar.offsetWidth;
  bar.style.transition='transform '+TIME+'ms linear';bar.style.transform='scaleX(0)';
  S.tm=setTimeout(timeUp,TIME);S.tm2=setTimeout(function(){bar.classList.add('warn');},TIME*0.7);
}
function stopTimer(){
  clearTimeout(S.tm);clearTimeout(S.tm2);
  var bar=document.getElementById('tbar');
  if(bar){var m=getComputedStyle(bar).transform;bar.style.transition='none';bar.style.transform=m;}
}
function timeUp(){if(S.answered)return;S.answered=true;stopTimer();finish(false,null,true);}

/* ---------- Answer ---------- */
function pick(choice){
  if(S.answered)return;S.answered=true;stopTimer();
  var q=S.qs[S.qi],ok;
  if(q.type==='state'||q.type==='basket')ok=(choice===q.kind);
  else if(q.type==='ending')ok=(choice===q.ans);
  else ok=(Number(choice)===q.a);
  finish(ok,choice,false);
}
function finish(ok,choice,timeout){
  var q=S.qs[S.qi],card=document.getElementById('card'),btns=card.querySelectorAll('[data-act="pick"]'),i;
  var correctKey=(q.type==='state'||q.type==='basket')?q.kind:(q.type==='ending'?q.ans:String(q.a));
  for(i=0;i<btns.length;i++){
    var b=btns[i],v=b.getAttribute('data-v');b.disabled=true;
    if(v===correctKey)b.classList.add('right');
    else if(!ok&&choice!==null&&v===String(choice))b.classList.add('wrong');
  }
  var vEl=document.getElementById('verb');
  if(vEl){vEl.classList.add(STATES[q.kind].cls);var vw=vEl.querySelector('.vow');vw.classList.remove('ph');vw.textContent=q.vf.slice(q.v.length);}
  var bl=document.getElementById('blank');
  if(bl){bl.textContent=q.vf;bl.classList.add('filled');}
  if(q.type==='tap'){var tb=card.querySelectorAll('.word')[q.v];if(tb)tb.textContent=q.vf;}
  var rare=false;
  if(ok){S.cur.correct++;S.streak++;rare=(S.streak%3===0);S.cur.stars+=rare?2:1;if(rare)S.cur.rare++;S.cur.beads[S.qi]='ok';}
  else{S.streak=0;S.lives--;S.cur.beads[S.qi]='no';S.cur.mist.push(q);card.classList.add('shake');}
  document.getElementById('hudslot').innerHTML=hud(ok);
  refreshDressing(ok);
  var head,cls='fb';
  if(ok){head=rare?'ثلاث متتالية! نجمة إضافية: +٢ نجمة':pickOne(['أحسنتِ! +١ نجمة','رائع! +١ نجمة','تصميم جميل! +١ نجمة','ممتاز! +١ نجمة']);if(rare)cls+=' rare';}
  else{head=timeout?'انتهى الوقت!':'ليس تمامًا، تذكّري القاعدة:';cls+=' bad';}
  var extra='';
  if(!ok&&q.type==='ending'&&choice==='kasra')extra=' ولا يُكسر آخر المضارع هنا.';
  if(!ok&&q.type==='tap'&&Number(choice)===q.v)extra=' الفعل هو الكلمة الملوَّنة، والمطلوب الأداة التي قبله.';
  var label=S.lives===0?'انتهت القلوب':(S.qi+1>=S.qs.length?'انتهت المرحلة':'السؤال التالي');
  card.insertAdjacentHTML('beforeend','<div class="'+cls+'" id="fb"><h3>'+head+'</h3><p>'+explain(q)+extra+'</p><button class="cta" id="nextbtn" data-act="next" type="button">'+label+'</button></div>');
  var nb=document.getElementById('nextbtn');
  if(nb){try{nb.focus({preventScroll:true});nb.scrollIntoView({block:'nearest'});}catch(e){}}
}
function next(){
  if(S.lives===0)return fail();
  if(S.qi+1>=S.qs.length)return levelDone();
  S.qi++;showQuestion();
}
function levelDone(){
  var r=S.cur;S.res[S.lv]=r;S.cur=null;
  var last=S.lv>=2,g=stars();
  render('<section class="panel"><p class="eyebrow">اكتملت المرحلة</p><h2 class="title">'+LEVELS[S.lv].name+'</h2>'
   +dressing(g)
   +'<div class="stats"><div class="stat"><b>'+ar(r.stars)+'</b><span>نجوم'+(r.rare?' (منها نجمة إضافية)':'')+'</span></div><div class="stat"><b>'+ar(r.correct)+' / '+ar(r.total)+'</b><span>إجابات صحيحة</span></div></div>'
   +(r.mist.length?'<details class="rev"><summary>راجعي أخطاءك ('+ar(r.mist.length)+')</summary>'+mistakeItems(r.mist)+'</details>':'')
   +'<button class="cta" data-act="nextlevel" type="button">'+(last?'اكشفي النتيجة':'المرحلة التالية')+'</button></section>');
}
function fail(){
  var r=S.cur;
  render('<section class="panel"><p class="eyebrow">'+LEVELS[S.lv].name+'</p><h2 class="title">نفدت القلوب!</h2>'
   +'<p class="lead">ضاعت ثلاثة قلوب. راجعي الأخطاء ثم أعيدي المرحلة بأسئلة جديدة.</p>'
   +(r.mist.length?'<details class="rev" open><summary>راجعي أخطاءك ('+ar(r.mist.length)+')</summary>'+mistakeItems(r.mist)+'</details>':'')
   +'<div class="btnrow"><button class="cta" data-act="retry" type="button">أعيدي المرحلة</button>'+(S.lv<2?'<button class="cta ghost" data-act="guide" type="button">افتحي الدليل</button>':'')+'</div></section>');
}
function final(){
  setBg(2);
  var c=0,t=0,g=0,mist=[];
  S.res.forEach(function(r){c+=r.correct;t+=r.total;g+=r.stars;mist=mist.concat(r.mist);});
  var pct=t?c/t:0,rank,msg;
  if(pct>=0.9){rank='أميرة الإعراب';msg='إطلالتك كاملة وإعرابك دقيق! أنتِ تعرفين القواعد جيدًا.';}
  else if(pct>=0.65){rank='مصمّمة موهوبة';msg='أداء جميل. راجعي أخطاءك لتكتمل إطلالتك.';}
  else{rank='مصمّمة مجتهدة';msg='كل مصمّمة بدأت بخطوة. اقرئي الدليل وجرّبي من جديد.';}
  var best=getBest(),isNew=g>best;if(isNew)setBest(g);
  render('<section class="panel"><p class="eyebrow">النتيجة النهائية</p><div class="finalavatar">'+avatar(g)+'</div><h2 class="title big">'+rank+'</h2><p class="lead" style="text-align:center">'+msg+'</p>'
   +'<div class="stats"><div class="stat"><b>'+ar(g)+'</b><span>مجموع النجوم</span></div><div class="stat"><b>'+ar(c)+' / '+ar(t)+'</b><span>إجابات صحيحة</span></div></div>'
   +(isNew?'<p class="best" style="text-align:center">رقم قياسي جديد!</p>':'')
   +(mist.length?'<details class="rev"><summary>راجعي أخطاءك ('+ar(mist.length)+')</summary>'+mistakeItems(mist)+'</details>':'')
   +'<div class="btnrow"><button class="cta" data-act="again" type="button">تصميم جديد</button><button class="cta ghost" data-act="home" type="button">الشاشة الرئيسية</button></div></section>');
}

/* ---------- Events ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest?e.target.closest('[data-act]'):null;if(!t||t.disabled)return;
  var a=t.getAttribute('data-act');
  if(a==='new'||a==='again'){newGame();intro();}
  else if(a==='go'){beginLevel();}
  else if(a==='pick'){pick(t.getAttribute('data-v'));}
  else if(a==='next'){next();}
  else if(a==='guide'){openGuide(t);}
  else if(a==='close'){closeGuide();}
  else if(a==='nextlevel'){if(S.lv<2){S.lv++;intro();}else final();}
  else if(a==='retry'){beginLevel();}
  else if(a==='home'){newGame();start();}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!sheet.hidden)closeGuide();});
start();
})();
</script>

</body></html>
